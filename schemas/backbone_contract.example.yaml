schema_name: BackboneContract
schema_version: 1
backbone_id: qwen3_vl_4b_reference
backbone_type: vlm_llm

inputs:
  - image
  - query
  - optional_roi
  - selected_adapter_id

outputs:
  - answer_text_or_structured_answer
  - latent_state
  - taxonomy_features
  - confidence
  - memory_profile

adapter_slots:
